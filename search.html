<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 리뷰 - 검색 결과</title>
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/tab.css" />
  <link rel="stylesheet" href="./styles/thumbnail.css" />
  <link rel="stylesheet" href="./styles/modal.css" />
</head>

<body>
  <div id="app"></div>

<header style="position: relative; width: 100%;">
  
  <div class="header-top-wrapper">
    <h1 class="logo">
      <a href="./"><img src="./images/logo.png" alt="MovieList" /></a>
    </h1>

    <form class="pretty-search-bar" action="./search.html" method="GET">
      <input type="text" class="search-input" name="q" placeholder="검색어를 입력하세요" required/>
      <button type="submit" class="search-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
       </button>
    </form>
  </div>
</header>

  <main>
    <section class="thumbnail-section">
      <h2 id="resultTitle">검색 결과</h2>
      <ul class="thumbnail-list">
      </ul>
      <button type="button" id="more-page-button" class="primary hidden">더 보기</button>
    </section>
  </main>
   
  <div class="modal-background" id="modalBackground">
    <div class="modal">
      <button class="close-modal" id="closeModal">
        <img src="./images/modal_button_close.png" alt="닫기" />
      </button>
      <div class="modal-container" id="modalContainer">
        
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 우아한테크코스 All Rights Reserved.</p>
    <p><img src="./images/woowacourse_logo.png" width="180" /></p>
  </footer>

  <script type="module" src="./src/search.ts"></script>

</body>

</html>
