<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/styles/reset.css" />
    <link rel="stylesheet" href="./public/styles/main.css" />
    <link rel="stylesheet" href="./public/styles/tab.css" />
    <link rel="stylesheet" href="./public/styles/thumbnail.css" />
    <title>영화 리뷰</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="background-container">
          <div class="overlay" aria-hidden="true"></div>
          <div class="top-rated-container">
            <h1 class="logo">
              <img src="./images/logo.png" alt="MovieList" />
            </h1>

            <input id="search-input" />
            <button id="search-button">검색</button>

            <div class="top-rated-movie">
              <div class="rate">
                <img src="./images/star_empty.png" class="star" />
                <span class="rate-value"></span>
              </div>
              <div class="title"></div>
              <button class="primary detail">자세히 보기</button>
            </div>
          </div>
        </div>
      </header>
      <div class="container" id="wrap">
        <ul class="tab">
          <li>
            <a href="#">
              <div class="tab-item selected"><h3>상영 중</h3></div>
            </a>
          </li>
          <li>
            <a href="#">
              <div class="tab-item"><h3>인기순</h3></div>
            </a>
          </li>
          <li>
            <a href="#">
              <div class="tab-item"><h3>평점순</h3></div>
            </a>
          </li>
          <li>
            <a href="#">
              <div class="tab-item"><h3>상영 예정</h3></div>
            </a>
          </li>
        </ul>
        <main>
          <section>
            <h2 id="movie-list-title">지금 인기 있는 영화</h2>
            <template id="movie-template">
              <li data-movie-id="">
                <div class="item">
                  <img class="thumbnail" src="" alt="" />
                  <div class="item-desc">
                    <p class="rate">
                      <img
                        src="./images/star_empty.png"
                        class="star"
                      /><span></span>
                    </p>
                    <strong></strong>
                  </div>
                </div>
              </li>
            </template>
            <ul class="thumbnail-list"></ul>
            <button class="primary" id="more-button">더보기</button>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p><img src="./images/woowacourse_logo.png" width="180" /></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
