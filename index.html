<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="./styles/reset.css" rel="stylesheet"/>

  <title>영화 리뷰</title>

<div id="app">
  <header>
    <div class="logo-input-wrapper">
      <button class="logo" id="logo">
        <img alt="MovieList" src="./images/logo.png"/>
      </button>
      <div class="movie-search">
        <input
          autocomplete="off"
          id="search-input"
          placeholder="검색어를 입력하세요"
          type="text"
        />
        <button id="search-button">
          <img alt="검색" src="./images/search.png"/>
        </button>
      </div>
    </div>
    <div class="background-container" id="background-container">
      <div aria-hidden="true" class="overlay"></div>
      <div class="top-rated-container">
        <div class="top-rated-movie">
          <div class="rate">
            <img class="star" src="./images/star_empty.png"/>
            <span class="rate-value"></span>
          </div>
          <h3 class="title"></h3>
          <button class="primary detail">자세히 보기</button>
        </div>
      </div>
    </div>
  </header>
