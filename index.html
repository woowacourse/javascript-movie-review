<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./templates/styles/index.css" />
    <title>영화 리뷰</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="search-container">
          <input class="search-bar" placeholder="검색어를 입력하세요" />
          <button class="search-btn">🔍</button>
        </div>
        <div class="background-container">
          <div class="overlay" aria-hidden="true">
            <img src="./templates/images/woowacourse_logo.png" />
          </div>
          <div class="top-rated-container">
            <h1 class="logo">
              <img src="./templates/images/logo.png" alt="MovieList" />
            </h1>
          </div>
        </div>
      </header>
      <div class="container">
        <main>
          <section>
            <p class="page-title">지금 인기 있는 영화</p>
            <div class="search-error-container" hidden>
              <img src="" alt="" />
              <p class="search-error-text">검색 결과가 없습니다.</p>
            </div>
            <ul class="thumbnail-list"></ul>
          </section>
          <div class="btn-container">
            <button type="button" class="display-more-btn">더 보기</button>
          </div>
        </main>
      </div>

      <footer>
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p><img src="./templates/images/woowacourse_logo.png" width="180" /></p>
      </footer>
    </div>
  </body>
</html>
