<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/thumbnail.css" />
    <link rel="stylesheet" href="./styles/modal.css" />
    <title>영화 리뷰</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo-input-wrapper">
          <button class="logo" id="logo">
            <img src="./images/logo.png" alt="MovieList" />
          </button>
          <div class="movie-search">
            <input
              type="text"
              id="search-input"
              placeholder="검색어를 입력하세요"
              autocomplete="off"
            />
            <button id="search-button">
              <img src="./images/search.png" alt="검색" />
            </button>
          </div>
        </div>
        <div class="background-container" id="background-container">
          <div class="overlay" aria-hidden="true"></div>
          <div class="top-rated-container">
            <div class="top-rated-movie">
              <div class="rate">
                <img src="./images/star_empty.png" class="star" />
                <span class="rate-value"></span>
              </div>
              <h3 class="title"></h3>
              <button class="primary detail">자세히 보기</button>
            </div>
          </div>
        </div>
      </header>
      <div class="container">
        <main>
          <section id="result-section">
            <h2 class="sub-title" id="sub-title">지금 인기 있는 영화</h2>

            <ul class="thumbnail-list hidden" id="main-thumbnail-list"></ul>
            <ul class="thumbnail-list hidden" id="search-thumbnail-list"></ul>
            <div id="main-error-container"></div>
            <ul class="thumbnail-list hidden" id="skeleton-list">
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
              <li class="skeleton">
                <div class="item">
                  <div class="thumbnail"></div>
                  <div class="item-desc">
                    <p class="rate"></p>
                    <p class="title"></p>
                  </div>
                </div>
              </li>
            </ul>

            <div class="unexpected-container hidden" id="empty-container">
              <img src="./images/으아아행성이.png" alt="" />
              <p>검색 결과가 없습니다.</p>
            </div>

            <div class="unexpected-container hidden" id="error-container">
              <img src="./images/으아아행성이.png" alt="" />
              <p>🚨 에러 발생 🚨</p>
              <button>재시도</button>
            </div>

            <button class="see-more-button hidden" id="main-see-more-button">
              더 보기
            </button>
            <button class="see-more-button hidden" id="search-see-more-button">
              더 보기
            </button>
          </section>
        </main>
      </div>
      <div id="sentinel"></div>
      <footer class="footer">
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p>
          <img src="./images/woowacourse_logo.png" width="180" />
        </p>
      </footer>
    </div>
    <div class="modal-background active" id="modalBackground">
      <div class="modal" id="modal">
        <button class="close-modal" id="closeModal">
          <img src="./images/modal_button_close.png" />
        </button>
        <div class="modal-container">
          <div class="modal-image modal-skeleton-image" id="modal-image">
            <img src="" alt="" />
          </div>
          <div class="modal-description" id="modal-description">
            <h2
              id="modal-title"
              class="modal-skeleton modal-skeleton-title"
            ></h2>
            <p
              id="modal-category"
              class="modal-skeleton modal-skeleton-category"
            ></p>
            <p class="rate">
              <img src="./images/star_filled.png" class="star" /><span
                id="modal-rate"
                class="modal-skeleton modal-skeleton-rate"
              ></span>
            </p>
            <hr />
            <h3 id="modal-my-rate" class="modal-sub-title">내 별점</h3>
            <p id="modal-rate-stars" class="modal-rate-stars">
              <img
                src="./images/star_empty.png"
                class="modal-my-rate-star"
                id="modal-my-rate-star-1"
              />
              <img
                src="./images/star_empty.png"
                class="modal-my-rate-star"
                id="modal-my-rate-star-2"
              />
              <img
                src="./images/star_empty.png"
                class="modal-my-rate-star"
                id="modal-my-rate-star-3"
              />
              <img
                src="./images/star_empty.png"
                class="modal-my-rate-star"
                id="modal-my-rate-star-4"
              />
              <img
                src="./images/star_empty.png"
                class="modal-my-rate-star"
                id="modal-my-rate-star-5"
              />
              <span>
                <span class="modal-rate-review" id="modal-rate-review"
                  >명작이에요</span
                >
                <span class="modal-rate-points" id="modal-rate-points"
                  >(8/10)</span
                ></span
              >
            </p>
            <hr />
            <h3 id="modal-detail-title" class="modal-sub-title">줄거리</h3>
            <p
              class="detail"
              id="modal-detail"
              class="modal-skeleton modal-skeleton-detail"
            ></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
