<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/tab.css" />
    <link rel="stylesheet" href="/styles/thumbnail.css" />
    <link rel="stylesheet" href="/styles/skeleton.css" />
    <link rel="stylesheet" href="/styles/search.css" />
    <link rel="stylesheet" href="/styles/message-box.css" />
    <title>영화 리뷰</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="background-container">
          <div class="header-bar">
            <h1 class="logo">
              <a href="/"><img src="/images/logo.png" alt="MovieList" /></a>
            </h1>

            <div class="search-box">
              <input id="search-input" placeholder="검색어를 입력하세요" />
              <button id="search-button">검색</button>
            </div>
          </div>
          <div class="overlay" aria-hidden="true"></div>
          <div class="top-rated-container">
            <div class="top-rated-movie">
              <div class="rate">
                <img src="/images/star_empty.png" class="star" />
                <span class="rate-value"></span>
              </div>
              <div class="title">&nbsp;</div>
              <button class="primary detail">자세히 보기</button>
            </div>
          </div>
        </div>
      </header>
      <div class="container" id="wrap">
        <main>
          <section>
            <h2 id="movie-list-title">지금 인기 있는 영화</h2>
            <div id="no-result"></div>
            <template id="movie-template">
              <li data-movie-id="">
                <div class="item">
                  <img class="thumbnail" src="" alt="" />
                  <div class="dummy-img"></div>
                  <div class="item-desc">
                    <p class="rate">
                      <img src="/images/star_empty.png" class="star" /><span
                        >&nbsp;</span
                      >
                    </p>
                    <strong>&nbsp;</strong>
                  </div>
                </div>
              </li>
            </template>
            <ul class="thumbnail-list skeleton-list" id="skeleton"></ul>
            <ul class="thumbnail-list" id="movie-list"></ul>
            <button class="primary" id="more-button">더보기</button>
          </section>
        </main>
      </div>

      <footer class="footer">
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p><img src="/images/woowacourse_logo.png" width="180" /></p>
      </footer>
    </div>

    <div id="modal"></div>
    <template id="detail-modal">
      <div class="modal-background active" id="modalBackground">
        <div class="modal">
          <button class="close-modal" id="closeModal">
            <img src="./images/modal_button_close.png" />
          </button>
          <div class="modal-container">
            <div class="modal-image">
              <img
                src="https://image.tmdb.org/t/p/original//pmemGuhr450DK8GiTT44mgwWCP7.jpg"
              />
            </div>
            <div class="modal-description">
              <h2>인사이드 아웃 2</h2>
              <p class="category">
                2024 · 모험, 애니메이션, 코미디, 드라마, 가족
              </p>
              <p class="rate">
                <img src="./images/star_filled.png" class="star" /><span
                  >7.7</span
                >
              </p>
              <hr />
              <h3>내 별점</h3>
              <div class="rate-star">
                <div class="star-box">
                  <span class="star on"></span>
                  <span class="star"></span>
                  <span class="star"></span>
                  <span class="star"></span>
                  <span class="star"></span>
                </div>
                <p class="star-message-box">
                  <span class="star-message">명작이에요</span>
                  <span class="star-number">(8/10)</span>
                </p>
              </div>

              <hr />
              <h3>줄거리</h3>
              <p class="detail">
                13살이 된 라일리의 행복을 위해 매일 바쁘게 머릿속 감정 컨트롤
                본부를 운영하는 ‘기쁨’, ‘슬픔’, ‘버럭’, ‘까칠’, ‘소심’. 그러던
                어느 날, 낯선 감정인 ‘불안’, ‘당황’, ‘따분’, ‘부럽’이가 본부에
                등장하고, 언제나 최악의 상황을 대비하며 제멋대로인 ‘불안’이와
                기존 감정들은 계속 충돌한다. 결국 새로운 감정들에 의해 본부에서
                쫓겨나게 된 기존 감정들은 다시 본부로 돌아가기 위해 위험천만한
                모험을 시작하는데…
              </p>
            </div>
          </div>
        </div>
      </div>
    </template>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
