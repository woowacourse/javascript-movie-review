<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/styles/reset.css" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/styles/tab.css" />
  <link rel="stylesheet" href="src/styles/thumbnail.css" />
  <title>영화 리뷰</title>
</head>

<body>
  <div id="app">
    <header>
      <div class="background-container">
        <div class="overlay" aria-hidden="true"></div>
        <div class="top-rated-container">
          <div class="header-container">
            <h1 class="logo">
              <img src="src/images/logo.png" alt="MovieList" />
            </h1>
            <form class="search-form">
              <input class="search" type="text" placeholder="검색어를 입력하세요">
              <img src="src/images/search.svg" alt="search" />
            </form>
          </div>
          <div class="top-rated-movie">
            <div class="rate">
              <img src="src/images/star_empty.png" class="star" />
              <span class="rate-value">9.5</span>
            </div>
            <div class="title">인사이드 아웃2</div>
            <button class="primary detail">자세히 보기</button>
          </div>
        </div>
      </div>
    </header>
    <div class="container">
      <main>
        <section>
          <h2 class="home-section-heading">지금 인기 있는 영화</h2>
          <ul class="thumbnail-list">
          </ul>
        </section>
        <button class="primary load-more-button">더 보기</button>
      </main>
    </div>

    <footer class="footer">
      <p>&copy; 우아한테크코스 All Rights Reserved.</p>
      <p><img src="src/images/woowacourse_logo.png" width="180" /></p>
    </footer>
  </div>
  <script src="src/main.ts" type="module"></script>
</body>

</html>
