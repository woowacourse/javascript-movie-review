<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./templates/styles/index.css" />
    <title>영화 리뷰</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="background-container">
          <div class="logo-container">
            <img src="./templates/images/logo.png" alt="MovieList" />
            <div class="search-container">
              <input class="search-bar" placeholder="검색어를 입력하세요" />
              <button class="search-btn">🔍</button>
            </div>
          </div>
          <div class="overlay" aria-hidden="true">
            <img alt="영화 이미지" />
          </div>
          <div class="top-rated-container">
            <div class="top-rated-movie">
              <div class="rate">
                <img src="./templates/images/star_empty.png" class="star" />
                <span class="rate-value"></span>
              </div>
              <div class="title"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="container">
        <main>
          <section>
            <p class="page-title">지금 인기 있는 영화</p>
            <div class="error-container" hidden>
              <img
                class="error-icon"
                src="/templates/images/error_icon.png"
                alt=""
              />
              <p class="error-text"></p>
            </div>

            <ul class="thumbnail-list"></ul>
          </section>
          <!-- <div class="btn-container">
            <button type="button" class="display-more-btn">더 보기</button>
          </div> -->
        </main>
      </div>

      <footer>
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p><img src="./templates/images/woowacourse_logo.png" width="180" /></p>
      </footer>
    </div>

    <div class="modal-background" id="modalBackground">
      <div class="modal">
        <button class="close-modal" id="closeModal">
          <img src="./templates/images/modal_button_close.png" />
        </button>
        <div class="modal-container">
          <div class="modal-image">
            <img
              src="https://image.tmdb.org/t/p/original//pmemGuhr450DK8GiTT44mgwWCP7.jpg"
            />
          </div>
          <div class="modal-description">
            <div class="movie-detail">
              <h2></h2>
              <p class="category"></p>
              <div class="rate">
                <span>평균 &nbsp;</span>
                <img src="./templates/images/star_filled.png" class="star" />
                <p class="rate_average"></p>
              </div>
            </div>
            <hr />
            <p class="rate-title">내 별점</p>
            <div class="user-rate">
              <div class="star-container">
                <img
                  src="./templates/images/star_empty.png"
                  class="star"
                  value="1"
                />
                <img
                  src="./templates/images/star_empty.png"
                  class="star"
                  value="2"
                />
                <img
                  src="./templates/images/star_empty.png"
                  class="star"
                  value="3"
                />
                <img
                  src="./templates/images/star_empty.png"
                  class="star"
                  value="4"
                />
                <img
                  src="./templates/images/star_empty.png"
                  class="star"
                  value="5"
                />
              </div>
              <div class="rate-detail">
                <span class="rate-description"></span>
                <span class="rate-percentage"></span>
              </div>
            </div>
            <hr />
            <p class="detail-title">줄거리</p>
            <p class="detail"></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
