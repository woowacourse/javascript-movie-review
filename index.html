  <head>
    <meta charset="UTF-8" />

    <title>영화 리뷰</title>

  <body>
    <div id="app">
      <header>
        <div class="top-header-conatiner">
          <button tabindex="0" class="logo">
            <img src="./src/assets/logo.png" alt="MovieList" />
          </button>
          <form class="search">
            <input
              class="search-input"
              type="text"
              aria-label="검색"
              placeholder="검색어를 입력하세요"
              required
            />
            <button class="search-button">
              <img src="./src/assets/serchIcon.png" alt="검색버튼" />
            </button>
          </form>
        </div>

        <div class="background-container">
          <div class="overlay" aria-hidden="true">
            <img class="background-img" />
          </div>
          <div class="top-rated-container">
            <div class="top-rated-movie">
              <div class="rate">
                <img src="./src/assets/star_empty.png" class="star" />
                <span class="rate-value">-</span>
              </div>
              <div class="title">&nbsp;</div>
              <button class="primary detail">자세히 보기</button>
            </div>
          </div>
        </div>
      </header>
      <div class="container">

        <main>
          <section class="section-container">
            <h2 class="section-title">지금 인기 있는 영화</h2>
            <ul class="thumbnail-list">
              <li class="movie-skeleton"></li>
              <li class="movie-skeleton"></li>
              <li class="movie-skeleton"></li>
              <li class="movie-skeleton"></li>
              <li class="movie-skeleton"></li>

              <li class="movie-skeleton"></li>

              <li class="movie-skeleton"></li>

            <div class="not-search-found-container">
              <img class="not-search-found-img" src="./src/assets/searchNotFoundIcon.png" alt="검색 결과가 없어서 머리가 지끈한 행성이 이미지"/>
              <h2 class="not-search-found-text">검색 결과가 없습니다.</h2>
            </div>
          </section>
        </main>
      </div>

      <footer class="footer">

        <dialog class="modal">
        <button class="close-modal" id="closeModal">
          <img src="./src/assets/modal_button_close.png" />
        </button>
        <div class="modal-container">
          <div class="modal-image">
            <img
            class="modal-poster-image"
            />
          </div>
          <div class="modal-description">
            <h2 class="modal-movie-title">-</h2>
            <p class="category">
              -
            </p>
            <p class="rate">
              <img src="./src/assets/star_filled.png" class="star" />
              <span class="detail-rate-value">7.7</span
              >
            </p>
            <hr />
            <div class="review-container">
            <h3 class="review-title">내 별점</h3>
            <div class="review-star-container">
              <span>
              <img class="review-star star-first" data-score="2" src="./src/assets/star_empty.png"/>
              <img class="review-star star-second" data-score="4" src="./src/assets/star_empty.png"/>
              <img class="review-star star-third" data-score="6" src="./src/assets/star_empty.png"/>
              <img class="review-star star-fourth" data-score="8" src="./src/assets/star_empty.png"/>
              <img class="review-star star-fifth " data-score="10" src="./src/assets/star_empty.png"/>
              </span>
              <span class="review-text">별점 없음</span><span class="review-score">(0/10)</span>
              
            </div>
            </div>
            <hr />
            <div class="overview-container">
            <h3>줄거리</h3>
            <p class="overview">
            </p>
            </div>
          </div>
        </div>
