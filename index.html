<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 리뷰</title>
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/tab.css" />
  <link rel="stylesheet" href="./styles/thumbnail.css" />
</head>

<body>
  <div id="app"></div>
  <header>
    <div class="background-container">
      <div class="overlay" aria-hidden="true"></div>
      <div class="top-rated-container">
        <h1 class="logo">
          <img src="./images/logo.png" alt="MovieList" />
        </h1>
        <div class="top-rated-movie">
          <div class="rate">
            <img src="./images/star_empty.png" class="star" />
            <span class="rate-value">9.5</span>
          </div>
          <div class="title">인사이드 아웃2</div>
          <button class="primary detail">자세히 보기</button>
        </div>
      </div>
    </div>

    <form class="pretty-search-bar" action="./search.html" method="GET">
      <input type="text" class="search-input" name="q" placeholder="검색어를 입력하세요" required/>
      <button type="submit" class="search-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      </button>
    </form>

  </header>
  <main>
    <section class="thumbnail-section">
      <h2>지금 인기 있는 영화</h2>
      <ul class="thumbnail-list">
      </ul>
      <button type="submit" id="more-page-button" class="primary hidden">더 보기</button>
    </section>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
