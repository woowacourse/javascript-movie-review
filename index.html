<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/tab.css" />
    <link rel="stylesheet" href="src/styles/thumbnail.css" />
    <link rel="stylesheet" href="src/styles/modal.css" />
    <title>영화 리뷰</title>
  </head>

  <body>
    <div id="app">
      <header>
        <div class="background-container">
          <div class="top-rated-container">
            <div class="header-container">
              <h1 class="logo">
                <a href="/javascript-movie-review">
                  <img src="src/images/logo.png" alt="MovieList" />
                </a>
              </h1>
              <form class="search-form">
                <input
                  class="search"
                  type="text"
                  placeholder="검색어를 입력하세요"
                />
                <button type="submit">
                  <img src="src/images/search.svg" alt="search" />
                </button>
              </form>
            </div>
          </div>
        </div>
      </header>
        <main>
          <div class="banner-container"></div>
          <div class="container">
            <section>
              <h2 class="home-section-heading"></h2>
              <ul class="thumbnail-list"></ul>
            </section>
            <button class="primary load-more-button">더 보기</button>
          </div>
        </main>
      </div>

      <footer class="footer">
        <p>&copy; 우아한테크코스 All Rights Reserved.</p>
        <p><img src="src/images/woowacourse_logo.png" width="180" /></p>
      </footer>
    </div>
    <dialog class="modal-background" id="modalBackground">
      <div class="modal">
        <button class="close-modal" id="closeModal" autofocus>
          <img src="src/images/modal_button_close.png" alt="close modal"/>
        </button>
        <div class="modal-container">
          <div class="modal-image">
            <img
              id="movie-detail-poster"
              src=""
              alt="movie poster"
            />
          </div>
          <div class="modal-description">
            <h2 id="movie-detail-title"></h2>
            <dl>
              <dt></dt>
              <dd class="category">
                <span id="movie-detail-release-year"></span> · <span id="movie-detail-category"></span>
              </dd>
              <div class="average-container">
                <dt>평균</dt>
                <dd class="rate">
                  <img src="src/images/star_filled.png" class="star" alt="vote average"/><span id="movie-detail-vote-average"></span>
                </dd>
              </div>
              <hr/>
              <div class="my-rating-container">
                <dt>내 별점</dt>
                <dd>
                  <div>
                    <button type="button" data-rating="2">
                      <img src="src/images/star_empty.png"/>
                    </button>
                    <button type="button" data-rating="4"><img src="src/images/star_empty.png"/></button>
                    <button type="button" data-rating="6"><img src="src/images/star_empty.png"/></button>
                    <button type="button" data-rating="8"><img src="src/images/star_empty.png"/></button>
                    <button type="button" data-rating="10"><img src="src/images/star_empty.png"/></button>
                  </div>
                  <span>명작이에요</span>
                  <span class="rating-ratio">(8/10)</span>
                </dd>
              </div>
              <hr/>
              <div class="detail-container">
                <dt>줄거리</dt>
                <dd id="movie-detail-overview" class="detail"></dd>
              </div>
            </dl>
          </div>
        </div>
      </div>
    </dialog>
    <script src="src/main.ts" type="module"></script>
  </body>
</html>
